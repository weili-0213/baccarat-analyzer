<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Baccarat Analyzer Tests
    </title>

    <style>

        :root {

            color-scheme: dark;

            --background: #0f172a;
            --panel: #1e293b;
            --panel-hover: #263449;

            --border: #334155;

            --text: #f8fafc;
            --muted: #94a3b8;

            --primary: #facc15;
            --primary-text: #111827;

            --pass: #22c55e;
            --fail: #ef4444;
            --running: #3b82f6;
            --waiting: #64748b;

        }

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            min-height: 100vh;

            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background: var(--background);

        }

        button {

            font: inherit;

        }

        .container {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

        }

        .pageHeader {

            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;

            margin-bottom: 24px;

        }

        .pageTitle {

            margin: 0 0 8px;

            font-size: 30px;

        }

        .pageDescription {

            margin: 0;

            color: var(--muted);

        }

        .runnerState {

            padding: 8px 12px;

            border: 1px solid var(--border);
            border-radius: 999px;

            color: var(--muted);

            background: var(--panel);

            white-space: nowrap;

        }

        .runnerState.running {

            color: #93c5fd;

            border-color: var(--running);

        }

        .runnerState.pass {

            color: #86efac;

            border-color: var(--pass);

        }

        .runnerState.fail {

            color: #fca5a5;

            border-color: var(--fail);

        }

        .toolbar {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }

        .button {

            min-height: 46px;

            padding: 10px 18px;

            border: none;
            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;

        }

        .button:hover:not(:disabled) {

            transform: translateY(-1px);

        }

        .button:disabled {

            cursor: not-allowed;

            opacity: 0.5;

        }

        .buttonPrimary {

            color: var(--primary-text);

            background: var(--primary);

        }

        .buttonSecondary {

            color: var(--text);

            background: #475569;

        }

        .buttonDanger {

            color: white;

            background: #991b1b;

        }

        .summary {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 12px;

            margin-bottom: 20px;

        }

        .summaryCard {

            min-height: 100px;

            padding: 16px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--panel);

        }

        .summaryLabel {

            color: var(--muted);

            font-size: 14px;

        }

        .summaryValue {

            margin-top: 8px;

            font-size: 26px;
            font-weight: bold;

        }

        .progressBox {

            margin-bottom: 20px;
            padding: 16px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--panel);

        }

        .progressHeader {

            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 10px;

            color: var(--muted);

        }

        .progressTrack {

            width: 100%;
            height: 12px;

            overflow: hidden;

            border-radius: 999px;

            background: #0f172a;

        }

        .progressBar {

            width: 0;
            height: 100%;

            background: var(--running);

            transition: width 0.2s ease;

        }

        .resultList {

            display: grid;

            gap: 12px;

        }

        .testCard {

            overflow: hidden;

            border: 1px solid var(--border);
            border-left: 6px solid var(--waiting);
            border-radius: 12px;

            background: var(--panel);

        }

        .testCard.running {

            border-left-color: var(--running);

        }

        .testCard.pass {

            border-left-color: var(--pass);

        }

        .testCard.fail {

            border-left-color: var(--fail);

        }

        .testHeader {

            padding: 16px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 14px;

        }

        .testInfo {

            min-width: 0;

        }

        .testName {

            margin: 0;

            font-size: 19px;

        }

        .testMeta {

            margin-top: 6px;

            color: var(--muted);

            font-size: 13px;

        }

        .testActions {

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .status {

            font-weight: bold;

            white-space: nowrap;

        }

        .status.waiting {

            color: var(--muted);

        }

        .status.running {

            color: #93c5fd;

        }

        .status.pass {

            color: #86efac;

        }

        .status.fail {

            color: #fca5a5;

        }

        .runSingleButton {

            padding: 8px 12px;

            border: 1px solid var(--border);
            border-radius: 7px;

            color: var(--text);

            background: #334155;

            cursor: pointer;

        }

        .runSingleButton:disabled {

            cursor: not-allowed;

            opacity: 0.5;

        }

        .details {

            display: none;

            margin: 0;

            padding: 16px;

            overflow-x: auto;

            border-top: 1px solid var(--border);

            color: #dbeafe;

            background: #111827;

            white-space: pre-wrap;
            word-break: break-word;

            font-family:
                Consolas,
                Monaco,
                monospace;

            font-size: 13px;
            line-height: 1.6;

        }

        .details.visible {

            display: block;

        }

        .emptyState {

            padding: 36px 20px;

            border: 1px dashed var(--border);
            border-radius: 12px;

            text-align: center;

            color: var(--muted);

        }

        .finalMessage {

            display: none;

            margin-top: 20px;
            padding: 18px;

            border: 1px solid var(--border);
            border-radius: 12px;

            text-align: center;

            background: var(--panel);

        }

        .finalMessage.visible {

            display: block;

        }

        .finalMessage.pass {

            color: #86efac;

            border-color: var(--pass);

        }

        .finalMessage.fail {

            color: #fca5a5;

            border-color: var(--fail);

        }

        @media (max-width: 700px) {

            body {

                padding: 14px;

            }

            .pageHeader {

                flex-direction: column;

            }

            .summary {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

            }

            .toolbar {

                display: grid;

                grid-template-columns: 1fr;

            }

            .button {

                width: 100%;

            }

            .testHeader {

                align-items: flex-start;
                flex-direction: column;

            }

            .testActions {

                width: 100%;

                justify-content: space-between;

            }

        }

    </style>

</head>

<body>

    <main class="container">

        <header class="pageHeader">

            <div>

                <h1 class="pageTitle">
                    Baccarat Analyzer Test Runner
                </h1>

                <p class="pageDescription">
                    Engine 與 Analysis 模組瀏覽器測試
                </p>

            </div>

            <div
                id="runnerState"
                class="runnerState"
            >
                等待執行
            </div>

        </header>

        <section class="toolbar">

            <button
                id="runAll"
                class="button buttonPrimary"
                type="button"
            >
                執行全部測試
            </button>

            <button
                id="runFailed"
                class="button buttonDanger"
                type="button"
                disabled
            >
                重跑失敗測試
            </button>

            <button
                id="clear"
                class="button buttonSecondary"
                type="button"
            >
                清除結果
            </button>

        </section>

        <section class="summary">

            <div class="summaryCard">

                <span class="summaryLabel">
                    總測試數
                </span>

                <strong
                    id="totalCount"
                    class="summaryValue"
                >
                    0
                </strong>

            </div>

            <div class="summaryCard">

                <span class="summaryLabel">
                    通過
                </span>

                <strong
                    id="passCount"
                    class="summaryValue"
                >
                    0
                </strong>

            </div>

            <div class="summaryCard">

                <span class="summaryLabel">
                    失敗
                </span>

                <strong
                    id="failCount"
                    class="summaryValue"
                >
                    0
                </strong>

            </div>

            <div class="summaryCard">

                <span class="summaryLabel">
                    總耗時
                </span>

                <strong
                    id="duration"
                    class="summaryValue"
                >
                    0 ms
                </strong>

            </div>

        </section>

        <section class="progressBox">

            <div class="progressHeader">

                <span id="progressText">
                    尚未執行
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progressTrack">

                <div
                    id="progressBar"
                    class="progressBar"
                ></div>

            </div>

        </section>

        <section
            id="results"
            class="resultList"
        >

            <div class="emptyState">
                按「執行全部測試」開始測試。
            </div>

        </section>

        <section
            id="finalMessage"
            class="finalMessage"
        ></section>

    </main>

    <script
        type="module"
        src="./main.js"
    ></script>

</body>

</html>
