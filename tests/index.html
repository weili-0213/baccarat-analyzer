<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Baccarat Analyzer Tests
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            padding: 20px;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: #f9fafb;

        }

        .container {

            width: 100%;
            max-width: 760px;

            margin: 0 auto;

        }

        h1 {

            margin-top: 0;

            font-size: 28px;

        }

        .toolbar {

            display: flex;
            gap: 10px;
            flex-wrap: wrap;

            margin-bottom: 20px;

        }

        button {

            padding: 12px 18px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

        }

        #runAll {

            background: #facc15;
            color: #111827;

        }

        #clear {

            background: #374151;
            color: white;

        }

        .summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 20px;

        }

        .summaryCard {

            padding: 14px;

            border-radius: 10px;

            background: #1f2937;

            text-align: center;

        }

        .summaryCard strong {

            display: block;

            margin-top: 6px;

            font-size: 24px;

        }

        .testCard {

            margin-bottom: 12px;
            padding: 16px;

            border-radius: 10px;

            background: #1f2937;

            border-left: 6px solid #6b7280;

        }

        .testCard.running {

            border-left-color: #3b82f6;

        }

        .testCard.pass {

            border-left-color: #22c55e;

        }

        .testCard.fail {

            border-left-color: #ef4444;

        }

        .testHeader {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 10px;

        }

        .testName {

            margin: 0;

            font-size: 18px;

        }

        .status {

            font-weight: bold;

        }

        .status.pass {

            color: #4ade80;

        }

        .status.fail {

            color: #f87171;

        }

        .status.running {

            color: #60a5fa;

        }

        .details {

            margin-top: 12px;

            white-space: pre-wrap;
            word-break: break-word;

            font-family:
                Consolas,
                monospace;

            font-size: 14px;

            color: #d1d5db;

        }

        @media (max-width: 600px) {

            body {

                padding: 12px;

            }

            .summary {

                grid-template-columns: 1fr;

            }

            button {

                width: 100%;

            }

        }

    </style>

</head>

<body>

    <main class="container">

        <h1>
            Baccarat Analyzer Test Runner
        </h1>

        <div class="toolbar">

            <button id="runAll">
                執行全部測試
            </button>

            <button id="clear">
                清除結果
            </button>

        </div>

        <section class="summary">

            <div class="summaryCard">

                總測試數

                <strong id="totalCount">
                    0
                </strong>

            </div>

            <div class="summaryCard">

                通過

                <strong id="passCount">
                    0
                </strong>

            </div>

            <div class="summaryCard">

                失敗

                <strong id="failCount">
                    0
                </strong>

            </div>

        </section>

        <section id="results"></section>

    </main>

    <script
        type="module"
        src="./main.js"
    ></script>

</body>

</html>
